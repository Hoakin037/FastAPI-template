volumes:
  fastapi-template-postgres:
  fastapi-template-minio-data:
  fastapi-template-minio-storage:
  fastapi-template-redis:

x-env: &default-env
  env_file:
    - ../.env

services:
  fastapi-template-postgres:
    container_name: fastapi-template-postgres
    image: postgres:15
    <<: *default-env
    volumes:
      - fastapi-template-postgres:/var/lib/postgresql/data
    restart: always
    ports:
      - "5470:5432"
    networks:
      - fastapi-template-network

  fastapi-template-minio:
    container_name: fastapi-template-minio
    image: minio/minio:latest
    command:
      server /data --console-address ":9001"
    <<: *default-env
    ports:
      - "9021:9000"
      - "9022:9001"
    volumes:
      - fastapi-template-minio-data:/var/lib/fastapi-template-minio
      - fastapi-template-minio-storage:/data
    restart: on-failure
    networks:
      - fastapi-template-network

  fastapi-template-redis:
    container_name: fastapi-template-redis
    image: redis/redis-stack:6.2.6-v5
    command: redis-server --requirepass ${REDIS_PASSWORD}
    <<: *default-env
    volumes:
      - fastapi-template-redis:/data
    restart: on-failure
    ports:
      - "6390:6379"
    networks:
      - fastapi-template-network

networks:
  fastapi-template-network:
    name: fastapi-template-network
