[project]
name = "fastapi-template"
version = "0.1.0"
description = ""
authors = [
    {name = "Hoakin",email = "Hoakin037@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "logging (>=0.4.9.6,<0.5.0.0)",
]

[tool.poetry]
packages = [{include = "fastapi_template", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
