[project]
name = "fastapi-template"
version = "0.1.0"
description = ""
authors = [
    {name = "Hoakin",email = "Hoakin037@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "logging (>=0.4.9.6,<0.5.0.0)",
    "fastapi-filter (>=3.0.0,<4.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "fastapi-pagination (>=0.15.16,<0.16.0)",
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "gitverse"
url = "https://pypi-mirror.gitverse.ru/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"